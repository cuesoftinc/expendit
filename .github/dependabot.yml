version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns: ["*"]

  # Monitor base images in each service Dockerfile.
  - package-ecosystem: docker
    directories: ["/api/common", "/api/statements", "/api/analytics", "/web"]
    schedule:
      interval: weekly
    groups:
      docker-dependencies:
        patterns: ["*"]
    ignore:
      # Runtime major upgrades require deliberate compatibility testing.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: golang
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  # Monitor image tags in the root Docker Compose stack.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /api/common
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # eslint 10 / typescript 7 crash eslint-config-next's typescript-eslint
      # toolchain (TypeError reading 'Cjs'); revisit when Next.js supports them.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime major (Node 24 in .nvmrc/Dockerfile).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /api/statements
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # NestJS 12 is ESM-only; ts-jest's decorator metadata doesn't support
      # it cleanly yet. Move together with the test runner, deliberately.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /api/analytics
    schedule:
      interval: weekly
    groups:
      pip-dependencies:
        patterns: ["*"]
