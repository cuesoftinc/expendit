# One chart deploys all services. Images are built from this repo — push to a
# registry and override per environment. Secrets (JWT_SECRET, SMTP, API keys)
# should come from Kubernetes Secrets in real deployments, not plain values.
#
# The chart does NOT deploy MongoDB or Redis. Point MONGODB_URL/REDIS_URL at
# reachable instances (managed services, or e.g. the bitnami/mongodb and
# bitnami/redis charts installed as `mongo`/`redis` in the same namespace —
# the default URLs below assume those service names).
replicaCount: 1

services:
  api-common:
    image: cuesoft/expendit-api-common:latest
    port: 8080
    healthPath: /health
    readyPath: /ready
    env:
      PORT: "8080"
      MONGODB_URL: mongodb://mongo:27017/expendit
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://web:3000
      # Rate-limit buckets key on the direct network peer until the ingress
      # ranges are verified. Behind an ingress controller or Cloudflare, set
      # TRUSTED_PROXY_CIDRS / CLOUDFLARE_PROXY_CIDRS to the real proxy ranges
      # (api/common/README.md §Trusted proxies) — not a hop count.
      TRUST_PROXY_HEADERS: "false"
    # Inject secrets (e.g. JWT_SECRET, SMTP creds) from a Kubernetes Secret:
    # envFrom:
    #   - secretRef: api-common-secrets

  web:
    image: cuesoft/expendit-web:latest
    port: 3000
    runAsUser: 1000 # node user in the web image
    healthPath: /
    env:
      PORT: "3000"

# Optional Ingress (see templates/ingress.yaml). Disabled by default: the chart's
# existing consumers publish through Cloud Run / App Hosting, not an ingress
# controller. Enable per-environment via a values overlay, e.g. values-local.yaml.
ingress:
  enabled: false
