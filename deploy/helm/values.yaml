# One chart deploys every service (docs/system-design.md §10.2). The same
# images run in cloud; this chart is the self-host and cluster path.
#
# The chart does NOT deploy Postgres, Kafka, Redis or object storage. Point
# them at managed services (Aiven, GCS) or at in-cluster charts, through a
# Kubernetes Secret per service (envFrom). Secrets never go in plain values:
#   common:     DATABASE_URL (a NON-superuser role: superusers bypass RLS),
#               UPLOAD_TICKET_PRIVATE_KEY, KAFKA_*, REDIS_PASSWORD,
#               STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY (s3 driver)
#   statements: UPLOAD_TICKET_PUBLIC_KEYS, KAFKA_*, STORAGE_* keys
#   analytics:  KAFKA_*, STORAGE_* keys, GROQ_API_KEY/GEMINI_API_KEY
replicaCount: 1

services:
  common:
    image: cuesoft/expendit-api-common:latest
    port: 8080
    healthPath: /health
    readyPath: /ready
    # Consumes Kafka and publishes the outbox: keep at least one running (S-12).
    replicaCount: 1
    env:
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: expendit
      STORAGE_PREFIX: expendit/selfhost
      STORAGE_ENDPOINT: minio:9000
      STORAGE_USE_SSL: "false"
      PORT: "8080"
      CORS_ORIGINS: https://expendit.example.com
      FIREBASE_PROJECT_ID: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    envFrom:
      - secretRef: expendit-common

  statements:
    image: cuesoft/expendit-api-statements:latest
    port: 8081
    runAsUser: 1000 # node user in the image
    healthPath: /health
    readyPath: /ready
    env:
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: expendit
      STORAGE_PREFIX: expendit/selfhost
      STORAGE_ENDPOINT: minio:9000
      STORAGE_USE_SSL: "false"
      PORT: "8081"
      CORS_ORIGINS: https://expendit.example.com
    envFrom:
      - secretRef: expendit-statements

  analytics:
    image: cuesoft/expendit-api-analytics:latest
    port: 8082
    healthPath: /health
    readyPath: /ready
    env:
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: expendit
      STORAGE_PREFIX: expendit/selfhost
      STORAGE_ENDPOINT: minio:9000
      STORAGE_USE_SSL: "false"
      PORT: "8082"
      # Both pools in one process; split into two Deployments with
      # extract/compute when the extract side needs to scale alone (D8).
      ANALYTICS_POOL: all
    envFrom:
      - secretRef: expendit-analytics

  web:
    image: cuesoft/expendit-web:latest
    port: 3000
    runAsUser: 1000 # node user in the web image
    healthPath: /
    env:
      PORT: "3000"

# Sweeps (§6.7), run as CronJobs from the common image.
jobs:
  image: cuesoft/expendit-api-common:latest
  envFrom:
    - secretRef: expendit-common
  env:
    STORAGE_DRIVER: s3
    STORAGE_BUCKET: expendit
    STORAGE_PREFIX: expendit/selfhost
    STORAGE_ENDPOINT: minio:9000
    STORAGE_USE_SSL: "false"
  schedules:
    reaper: "* * * * *"
    tmp-cleanup: "*/15 * * * *"
    retention: "17 3 * * *"

# Optional Ingress (templates/ingress.yaml): `host` serves one service (the
# web app); `apiHost` serves the API, sending /api/v1/uploads to statements
# and every other path to common (S-14). analytics never gets ingress.
ingress:
  enabled: false
