# One chart deploys all services. Images are built from this repo — push to a
# registry and override per environment. Secrets (JWT_SECRET, SMTP, API keys)
# should come from Kubernetes Secrets in real deployments, not plain values.
#
# The chart does NOT deploy MongoDB, Redis, or Kafka. Point MONGODB_URL/
# REDIS_URL at reachable instances (managed services, or e.g. the
# bitnami/mongodb and bitnami/redis charts installed as `mongo`/`redis` in
# the same namespace — the default URLs below assume those service names);
# point KAFKA_BROKERS (api-intake, api-process) at the managed Aiven Kafka
# instance via a Kubernetes Secret.
replicaCount: 1

services:
  api-common:
    image: cuesoft/expendit-api-common:latest
    port: 8080
    healthPath: /health
    readyPath: /ready
    env:
      PORT: "8080"
      MONGODB_URL: mongodb://mongo:27017/expendit
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://web:3000
      # Rate-limit buckets key on the direct network peer until the ingress
      # ranges are verified. Behind an ingress controller or Cloudflare, set
      # TRUSTED_PROXY_CIDRS / CLOUDFLARE_PROXY_CIDRS to the real proxy ranges
      # (api/common/README.md §Trusted proxies) — not a hop count.
      TRUST_PROXY_HEADERS: "false"
      TRUSTED_PROXY_CIDRS: ""
      TRUSTED_PROXY_HOPS: "0"
      CLOUDFLARE_PROXY_CIDRS: ""
      # Not sensitive — the OAuth client ID is public (embedded client-side too).
      GOOGLE_CLIENT_ID: ""
      EMAIL_FROM: noreply@example.com
      SMTP_PORT: "587"
    # Inject secrets (JWT_SECRET, SMTP_HOST/SMTP_USER/SMTP_PASSWORD,
    # GEMINI_API_KEY/GROQ_API_KEY self-host fallback) from a Kubernetes Secret:
    # envFrom:
    #   - secretRef: api-common-secrets

  api-intake:
    image: cuesoft/expendit-api-intake:latest
    port: 8081
    runAsUser: 1000 # node user in the intake image
    healthPath: /health
    readyPath: /ready
    env:
      PORT: "8081"
      CORS_ORIGINS: http://web:3000
      # Inject JWT_SECRET (must match api-common's — verifies the tokens it
      # issues) and KAFKA_BROKERS/KAFKA_USERNAME/KAFKA_PASSWORD/KAFKA_SSL_CA
      # from a Kubernetes Secret (see envFrom below) rather than plain values.
    # envFrom:
    #   - secretRef: api-intake-secrets

  api-process:
    image: cuesoft/expendit-api-process:latest
    port: 8082
    # runs as uid 10001 (the chart default) — matches the image's non-root appuser
    healthPath: /health
    readyPath: /ready
    env:
      PORT: "8082"
      # Inject KAFKA_BROKERS/KAFKA_USERNAME/KAFKA_PASSWORD/KAFKA_SSL_CA and
      # GEMINI_API_KEY/GROQ_API_KEY (self-host fallback only) from a
      # Kubernetes Secret rather than plain values.
    # envFrom:
    #   - secretRef: api-process-secrets

  web:
    image: cuesoft/expendit-web:latest
    port: 3000
    runAsUser: 1000 # node user in the web image
    healthPath: /
    env:
      PORT: "3000"

# Optional Ingress (see templates/ingress.yaml). Disabled by default: the chart's
# existing consumers publish through Cloud Run / App Hosting, not an ingress
# controller. Enable per-environment via a values overlay, e.g. values-local.yaml.
ingress:
  enabled: false
