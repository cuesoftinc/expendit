# Local and self-host stack (docs/system-design.md §10.2): the same images as
# cloud, with Postgres, Kafka (KRaft), Redis, MinIO and the Firebase auth
# emulator standing in for the managed services.
# Usage: cp .env.example .env  &&  make up
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - expendit-postgres:/var/lib/postgresql
      # Creates the non-superuser app role; superusers bypass RLS (S-11).
      - ./deploy/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expendit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly by kafka-init, as in Aiven.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./deploy/docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["sh", "/create-topics.sh", "kafka:9092"]
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - expendit-minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # Firebase auth emulator (X-1): Google sign-in without a real project.
  firebase-auth:
    image: node:24-alpine
    working_dir: /firebase
    command: ["npx", "-y", "firebase-tools@14", "emulators:start", "--only", "auth", "--project", "${FIREBASE_PROJECT_ID:-demo-expendit}"]
    volumes:
      - ./deploy/docker/firebase/firebase.json:/firebase/firebase.json:ro
    ports:
      - "9099:9099"
    restart: unless-stopped

  common:
    build: ./api/common
    image: cuesoft/expendit-api-common:latest
    ports:
      - "8080:8080"
    environment: &common-env
      PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgres://expendit_app:${APP_DB_PASSWORD:-expendit_app}@postgres:5432/expendit?sslmode=disable
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-expendit}
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST-firebase-auth:9099}
      UPLOAD_TICKET_PRIVATE_KEY: ${UPLOAD_TICKET_PRIVATE_KEY:?set UPLOAD_TICKET_PRIVATE_KEY in .env}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      KAFKA_SSL_CA: ${KAFKA_SSL_CA:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-expendit-local}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-expendit/local}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  statements:
    build:
      # Repo-root context: the image copies api/common/contract's schemas.
      context: .
      dockerfile: api/statements/Dockerfile
    image: cuesoft/expendit-api-statements:latest
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_TICKET_PUBLIC_KEYS: ${UPLOAD_TICKET_PUBLIC_KEYS:?set UPLOAD_TICKET_PUBLIC_KEYS in .env}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      KAFKA_SSL_CA: ${KAFKA_SSL_CA:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-expendit-local}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-expendit/local}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
    depends_on:
      common:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: api/analytics/Dockerfile
    image: cuesoft/expendit-api-analytics:latest
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      # Both worker pools in one process for compose (§10.2).
      ANALYTICS_POOL: all
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      KAFKA_SSL_CA: ${KAFKA_SSL_CA:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-expendit-local}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-expendit/local}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
      # Self-host AI (X-4): one key, or none for CSV/PDF-regex only.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      common:
        condition: service_healthy
    restart: unless-stopped

  # Sweeps (§6.7) as a long-running loop locally; Cloud Scheduler in cloud.
  jobs:
    image: cuesoft/expendit-api-common:latest
    environment: *common-env
    entrypoint:
      - sh
      - -c
      - |
        i=0
        while true; do
          ./jobs reaper
          [ $$((i % 15)) -eq 0 ] && ./jobs tmp-cleanup
          [ $$((i % 1440)) -eq 0 ] && ./jobs retention
          i=$$((i + 1)); sleep 60
        done
    depends_on:
      common:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: cuesoft/expendit-web:latest
    build:
      # Repo-root context: web/ plus docs/api/openapi.yaml (embedded for
      # /docs/api); pruned by web/Dockerfile.dockerignore.
      context: .
      dockerfile: web/Dockerfile
      args:
        # Inlined at build: the browser signs in against the Auth emulator
        # on the host's port 9099.
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-expendit}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST-localhost:9099}
    ports:
      - "3000:3000"
    environment:
      # The /api/v1 proxy forwards here (system-design.md §7.1).
      API_ORIGIN: http://common:8080
      UPLOADS_ORIGIN: http://statements:8081
    depends_on:
      common:
        condition: service_healthy
      statements:
        condition: service_healthy
      firebase-auth:
        condition: service_started
    restart: unless-stopped

volumes:
  expendit-postgres:
  expendit-minio:
